# Tests, builds the static site and deploys it to Cloudflare Pages.
#
# Runs on a push to main and on demand. No data is fetched here: the live data comes from the Worker and the files
# under public/data/ are committed snapshots, so a broken upstream feed can never break a deploy.
#
# Deploying needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    a token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   your account id (Workers & Pages overview, right-hand side)
# They are passed only to the three deploy steps, never to npm ci or the build.
# Without them the workflow still builds and tests the site; it just skips the deploy step.
name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one run at a time; a newer run waits instead of cancelling a deploy half way
concurrency:
  group: data-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: vigilradar # the Cloudflare Pages project name (becomes vigilradar.pages.dev; created by the workflow when missing)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Lint and type-check
        run: |
          npx next typegen # route types (PageProps, LayoutProps) are generated, not committed
          npx tsc --noEmit
          npm run lint

      - name: Build static site
        run: npm run build
        env:
          # baked into the static site at build time (docs/SETUP.md); empty means the site runs on its backup path
          NEXT_PUBLIC_WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Check deploy secrets
        id: secrets
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set as repository secrets."
          fi

      - name: Create the Pages project (first run only)
        if: steps.secrets.outputs.deploy == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create "$PROJECT" --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: Note when deploy was skipped
        if: steps.secrets.outputs.deploy != 'true'
        run: echo "Not main, or a Cloudflare secret is missing, so the site was built but not deployed."
