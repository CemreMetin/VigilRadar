# Refreshes the data, builds the static site and deploys it to Cloudflare Pages.
#
# Runs on every push to main, every 30 minutes, and on demand. Nothing is committed back to the repo:
# fresh data only lives in the deployed site, so the git history stays clean.
#
# Deploying needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    a token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   your account id (Workers & Pages overview, right-hand side)
# Without them the workflow still builds and tests the site; it just skips the deploy step.
name: data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *" # twice an hour, off the busy :00 and :30 marks
  workflow_dispatch:

# Only one run at a time; a newer run waits instead of cancelling a deploy half way
concurrency:
  group: data-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: monitoring # the Cloudflare Pages project name (becomes monitoring.pages.dev)
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GDELT daily aggregates are cached, so a normal run downloads only the missing day (about 7 MB).
      # The very first run downloads 30 days and takes a few minutes.
      - uses: actions/cache@v4
        with:
          path: .cache/gdelt
          key: gdelt-${{ github.run_id }}
          restore-keys: gdelt-

      # CelesTrak orbital elements are cached too: it allows one download per group every 2 hours.
      - uses: actions/cache@v4
        with:
          path: .cache/celestrak
          key: celestrak-${{ github.run_id }}
          restore-keys: celestrak-

      # Always the full refresh: with the cache above the slow feeds are cheap, and it avoids the
      # fast mode carrying over stale values from the committed copy of the data.
      - name: Refresh data
        run: npm run data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }} # optional: enables the active-fires layer

      # Own copy of the alert list for the site (no Telegram here; the faster alerts workflow does the sending)
      - name: Evaluate alerts
        run: npm run alerts -- --no-send

      - name: Tests
        run: npm test

      - name: Lint and type-check
        run: |
          npx next typegen # route types (PageProps, LayoutProps) are generated, not committed
          npx tsc --noEmit
          npm run lint

      - name: Build static site
        run: npm run build
        env:
          # live browser alarms read the fast alerts feed (branch alerts-feed, written every 5 minutes)
          NEXT_PUBLIC_ALERTS_URL: https://raw.githubusercontent.com/${{ github.repository }}/alerts-feed/alerts.json

      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set as repository secrets."
          fi

      - name: Create the Pages project (first run only)
        if: steps.secrets.outputs.deploy == 'true'
        continue-on-error: true
        run: npx wrangler pages project create "$PROJECT" --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.deploy == 'true'
        run: npx wrangler pages deploy out --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: Note when deploy was skipped
        if: steps.secrets.outputs.deploy != 'true'
        run: echo "A Cloudflare secret is missing, so the site was built but not deployed."
